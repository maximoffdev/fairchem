# tasks/iqa_decompose_subterms with V_ee split into its classical (Coulomb) and
# exchange-correlation parts, intra-atomic and pairwise:
#   V_ee(A,A) = V_ee^C(A,A) + V_ee^X(A,A),   V_ee(A,B) = V_ee^C(A,B) + V_ee^X(A,B).
# E_intra(A) = T + V_ne + V_ee^C + V_ee^X (A,A) and
# E_inter(A,B)/2 = (V_ne + V_en + V_nn + V_ee^C + V_ee^X)(A,B)/2 are not predicted.

- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: iqa_kinetic
  level: atom
  property: node_pred
  datasets: ${dataset_list}
  element_references:
    _target_: fairchem.core.modules.normalization.element_references.AtomElementReferences
    element_references:
      _target_: torch.DoubleTensor
      _args_:
        - ${element_refs.iqa_kinetic}
  loss_fn:
    _target_: fairchem.core.modules.loss.DDPMTLoss
    loss_fn:
      _target_: fairchem.core.modules.loss.MAELoss
    coefficient: ${iqa_kinetic_coef}
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: ${normalizer_mean_iqa_kinetic}
    rmsd: ${normalizer_rmsd_iqa_kinetic}
  out_spec:
    dim: [1]
    dtype: float32

