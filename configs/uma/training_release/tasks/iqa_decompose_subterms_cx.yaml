- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: iqa_vne_ab
  level: edge
  property: edge_pred
  datasets: ${dataset_list}
  # learn the residual to the neutral-atom Coulomb term -Z_A Z_B / 2R
  element_references:
    _target_: fairchem.core.modules.normalization.element_references.NeutralPointChargeEdgeReferences
    sign: -1
  loss_fn:
    _target_: fairchem.core.modules.loss.DDPMTLoss
    loss_fn:
      _target_: fairchem.core.modules.loss.MAELoss
    coefficient: ${iqa_vne_ab_coef}
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: ${normalizer_mean_iqa_vne_ab}
    rmsd: ${normalizer_rmsd_iqa_vne_ab}
  out_spec:
    dim: [1]
    dtype: float32

- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: iqa_ven_ab
  level: edge
  property: edge_pred
  datasets: ${dataset_list}
  # V_en(A,B) = V_ne(B,A) exactly: the head emits the V_ne prediction of the reversed
  # edge, so the references and normalizer must equal V_ne's.
  element_references:
    _target_: fairchem.core.modules.normalization.element_references.NeutralPointChargeEdgeReferences
    sign: -1
  loss_fn:
    _target_: fairchem.core.modules.loss.DDPMTLoss
    loss_fn:
      _target_: fairchem.core.modules.loss.MAELoss
    coefficient: ${iqa_ven_ab_coef}
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: ${normalizer_mean_iqa_vne_ab}
    rmsd: ${normalizer_rmsd_iqa_vne_ab}
  out_spec:
    dim: [1]
    dtype: float32

