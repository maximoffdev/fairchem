# q(A) model without total-charge conditioning and without the q(A) sum constraint
# (cf. iqa_charge_nochg_kfold.yaml), trained on the full train split without k-fold.
defaults:
  - iqa_charge_nochg_pretrain
  - override backbone: K2L2_48
  - _self_

cutoff_radius: 4.0  # A

job:
  run_name: charge-K${backbone.num_layers}L${backbone.lmax}-${backbone.sphere_channels}ch-fulltrain_nochargecond_noqsum_lagcut5e-4_otf_300neighbors_4A_${cluster.timeout_hr}h

heads:
  iqa_charge:
    conserve_total_charge: False
