# Validation metrics on quantities built from several task predictions, logged as
# val/mae/<name> (fairchem.core.units.mlip_unit.derived_metrics). The total energy is
# compared against e_total, so it includes the E_inter of the pairs beyond the otf
# cutoff, which the model does not predict (see IQA_SUBTERMS_CX_2026-10.md).

# E = sum_A (T + V_ne + V_ee^C + V_ee^X)(A)
#   + sum_(A,B) (V_ne + V_en + V_ee^C + V_ee^X + V_nn)(A,B)/2
- _target_: fairchem.core.units.mlip_unit.derived_metrics.SystemSumMAE
  name: total_energy
  target: energy
  tasks:
    - iqa_kinetic
    - iqa_vne
    - iqa_vee_c
    - iqa_vee_x
    - iqa_vne_ab
    - iqa_ven_ab
    - iqa_vee_c_ab
    - iqa_vee_x_ab
    - iqa_vnn_ab

# The subterms themselves, under the same val/mae/<name> keys as the subterms that
# derived_metrics/iqa_decompose_subterm_fractions reconstructs from fractions.
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_kinetic
  target: iqa_kinetic
  tasks: [iqa_kinetic]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vne
  target: iqa_vne
  tasks: [iqa_vne]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vee_c
  target: iqa_vee_c
  tasks: [iqa_vee_c]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vee_x
  target: iqa_vee_x
  tasks: [iqa_vee_x]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vne_ab
  target: iqa_vne_ab
  tasks: [iqa_vne_ab]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_ven_ab
  target: iqa_ven_ab
  tasks: [iqa_ven_ab]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vee_c_ab
  target: iqa_vee_c_ab
  tasks: [iqa_vee_c_ab]
- _target_: fairchem.core.units.mlip_unit.derived_metrics.ProductMAE
  name: iqa_vee_x_ab
  target: iqa_vee_x_ab
  tasks: [iqa_vee_x_ab]
