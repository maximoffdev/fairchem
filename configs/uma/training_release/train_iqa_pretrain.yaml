defaults:
  - cluster: local
  - dataset: iqa_components
  - tasks: iqa_decompose
  - backbone: K4L2_light
  - element_refs: iqa_intra_elem_refs




job:
  device_type: ${cluster.device}
  scheduler:
    mode: ${cluster.mode}
    ranks_per_node: ${cluster.ranks_per_node}
    num_nodes: 1
    slurm:
      partition: ${cluster.partition}
      mem_gb: ${cluster.mem_gb}
      cpus_per_task: ${cluster.cpus_per_task}
      timeout_hr: "${cluster.timeout_hr}"
      setup_commands: ${cluster.setup_commands}
  debug: ${cluster.debug}
  run_dir: ${cluster.run_dir}
  run_name: iqa-decompose-local-k4l2-light
  logger:
    _target_: fairchem.core.common.logger.WandBSingletonLogger.init_wandb
    _partial_: true
    entity: lamerslab
    project: iqa

# --- Runtime Hyperparameters ---
steps: 100000
bf16: True

# --- Backbone/Model Variables (interpolated from cluster where VRAM-sensitive) ---
moe_layer_type: pytorch
num_moe_experts: ${cluster.num_moe_experts}
otf_graph: False
max_neighbors: ${cluster.max_neighbors}
cutoff_radius: ${cluster.cutoff_radius}
regress_stress: False
direct_forces: False

# iqa_kinetic_coef: 0.2
# iqa_vne_coef: 0.2
# iqa_vee_coef: 0.2
# iqa_vee_c_coef: 0.2
# iqa_vee_x_coef: 0.2
# iqa_inter_coef: 1.0
# # Edge-level coefficients
# iqa_inter_edge_coef: 1.0
# iqa_vee_edge_coef: 1.0
# iqa_vne_edge_coef: 1.0
# iqa_ven_edge_coef: 1.0
# iqa_vnn_edge_coef: 1.0
normalizer_mean_iqa_kinetic: 1000.12
normalizer_rmsd_iqa_kinetic: 2022.36
normalizer_mean_iqa_vne: -2386.82
normalizer_rmsd_iqa_vne: 4815.85
normalizer_mean_iqa_vee: 392.778
normalizer_rmsd_iqa_vee: 772.831
normalizer_mean_iqa_vee_c: 493.686
normalizer_rmsd_iqa_vee_c: 909.29
normalizer_mean_iqa_vee_x: -100.909
normalizer_rmsd_iqa_vee_x: 140.044
normalizer_mean_iqa_intra_a: 0.0
normalizer_rmsd_iqa_intra_a: 1.0
normalizer_mean_iqa_inter_ab: -0.69783
normalizer_rmsd_iqa_inter_ab: 2.75929
iqa_intra_a_coef: 1.0
iqa_kinetic_coef: 1.0
iqa_vne_coef: 1.0
iqa_vee_coef: 1.0
iqa_vee_c_coef: 1.0
iqa_vee_x_coef: 1.0
#iqa_inter_a_coef: 0.0  # Set to 0 to skip inter_a loss while keeping model/head active
iqa_inter_ab_coef: 1.0

# --- Dataset Setup ---
dataset_list: ["iqa_pkl"]
exclude_keys: ["source", "sid"]


train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${dataset.iqa_train}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: ${cluster.max_atoms}
    shuffle: True
    seed: 123
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}

eval_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${dataset.iqa_val}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: ${cluster.max_atoms}
    shuffle: False
    seed: 123
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}

heads:
  iqa_combined_head:
    module: fairchem.core.models.uma.escn_md.IQA_IntraSO2MultiHead
    term_names:
      - iqa_kinetic
      - iqa_vne
      - iqa_vee
      - iqa_vee_c
      - iqa_vee_x
    aggregate_name: iqa_intra_a
    predict_aggregate: true
    edge_prediction: true
    edge_task_name: iqa_inter_ab
    term_normalizers:
      iqa_kinetic:
        mean: ${normalizer_mean_iqa_kinetic}
        rmsd: ${normalizer_rmsd_iqa_kinetic}
      iqa_vne:
        mean: ${normalizer_mean_iqa_vne}
        rmsd: ${normalizer_rmsd_iqa_vne}
      iqa_vee:
        mean: ${normalizer_mean_iqa_vee}
        rmsd: ${normalizer_rmsd_iqa_vee}
      iqa_vee_c:
        mean: ${normalizer_mean_iqa_vee_c}
        rmsd: ${normalizer_rmsd_iqa_vee_c}
      iqa_vee_x:
        mean: ${normalizer_mean_iqa_vee_x}
        rmsd: ${normalizer_rmsd_iqa_vee_x}
    term_element_refs:
      iqa_kinetic: ${element_refs.iqa_kinetic}
      iqa_vne: ${element_refs.iqa_vne}
      iqa_vee: ${element_refs.iqa_vee}
      iqa_vee_c: ${element_refs.iqa_vee_c}
      iqa_vee_x: ${element_refs.iqa_vee_x}

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: ${backbone}
      pass_through_head_outputs: true
      # _target_: fairchem.core.units.mlip_unit.mlip_unit.initialize_finetuning_model
      # checkpoint_location: /home/sc.uni-leipzig.de/rh41uvuh/.cache/huggingface/hub/models--facebook--UMA/snapshots/be2896459a03fcde05e20d2fcefd11f450601fce/checkpoints/uma-s-1p2.pt
      # overrides:
      #   freeze_backbone: true
      #   pass_through_head_outputs: false
      heads: ${heads}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 8e-4
      weight_decay: 1e-3
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2
      warmup_epochs: 0.01
      lr_min_factor: 0.01
      epochs: null
      steps: ${steps}
    print_every: 10
    clip_grad_norm: 100
    bf16: ${bf16}
  max_epochs: null
  max_steps: ${steps}
  evaluate_every_n_steps: 1000
  callbacks:
    - _target_: fairchem.core.common.profiler_utils.ProfilerCallback
      job_config: ${job}
    - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
      checkpoint_every_n_steps: 5000
      max_saved_checkpoints: 3
