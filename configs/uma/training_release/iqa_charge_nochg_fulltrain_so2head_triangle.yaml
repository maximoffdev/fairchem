# iqa_charge_nochg_fulltrain (no charge conditioning, no q(A) sum constraint) with the
# SO(2) triangle head of the best subterm model instead of the invariant MLP head.
# Same backbone (K2L2_48, 4 A), data and batch.
defaults:
  - iqa_charge_nochg_fulltrain
  - override charge_head: so2_triangle
  - _self_

job:
  run_name: charge-K${backbone.num_layers}L${backbone.lmax}-${backbone.sphere_channels}ch-fulltrain_so2head_triangle_attnnodes_nochargecond_noqsum_lagcut5e-4_otf_300neighbors_4A_${cluster.timeout_hr}h
