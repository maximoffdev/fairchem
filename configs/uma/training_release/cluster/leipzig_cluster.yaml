# Data is rsync'd to local NVMe before training (see setup_commands below)
data_root_dir: /tmp/iqa_data
original_data_root_dir: /work/rh41uvuh-iqa_train_2/HCNOSPClF_combined_datasets_filtered0.001
run_dir: /work/rh41uvuh-iqa_train_2/iqa
#run_dir: ${oc.env:PWD}/runs
account: null
qos: null
mode: SLURM
device: CUDA
ranks_per_node: 8
# Use file-based distributed init to avoid IPv6/TCP socket issues on the Clara partition
# (errno 97: EAFNOSUPPORT when nodes resolve to IPv6 but network only supports IPv4)
distributed_init_method: FILE
dataloader_workers: 0
debug: true
mem_gb: "0"
cpus_per_task: 4
timeout_hr: "48"
partition: clara
max_atoms: 360
max_neighbors: 30    # K4L2 is small enough to handle full neighbor count
num_moe_experts: 32
cpu_graph: False
# Commands injected by submitit before the Python worker starts.
# Copies dataset from shared storage to node-local NVMe for fast I/O.
setup_commands:
  - "trap 'echo \"[cleanup] Removing /tmp/iqa_data...\"; rm -rf /tmp/iqa_data' EXIT"
  - "echo \"[setup] Copying dataset to local NVMe...\""
  - "mkdir -p /tmp/iqa_data"
  - "rsync -aW --info=progress2 /work/rh41uvuh-iqa_train_2/HCNOSPClF_combined_datasets_filtered0.001/ /tmp/iqa_data/"
  - "echo \"[setup] Dataset copy complete.\""
