iqa_train:
  _target_: fairchem.core.datasets.iqa_pkl_dataset.IQAPKLDataset
  src: ${cluster.data_root_dir}/train
  name: iqa_pkl
  enforce_consistent_keys: true
  ht2ev: true
  key_mapping:
    energy: e_total
    iqa_kinetic: T(A)
    iqa_vne: Vne(A,A)
    iqa_vee: Vee(A,A)
    iqa_inter: E_IQA_Inter(A)

iqa_val:
  _target_: fairchem.core.datasets.iqa_pkl_dataset.IQAPKLDataset
  src: ${cluster.data_root_dir}/val
  name: iqa_pkl
  enforce_consistent_keys: true
  ht2ev: true
  key_mapping:
    energy: e_total
    iqa_kinetic: T(A)
    iqa_vne: Vne(A,A)
    iqa_vee: Vee(A,A)
    iqa_inter: E_IQA_Inter(A)
