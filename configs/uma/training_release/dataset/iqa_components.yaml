iqa_train:
  _target_: fairchem.core.datasets.iqa_pkl_dataset.IQAPKLDataset
  src: ${cluster.data_root_dir}/train
  name: ${dataset_list[0]}
  ht2ev: true
  # Charge conditioning: total molecular charge -> AtomicData.charge -> backbone
  charge_key: q_total
  # Mask atoms with |L(A)| > lagrangian_cutoff (a.u., AIM integration error) and all
  # edges touching them: their atom/edge labels become NaN and drop out of the loss.
  # System labels (e_total) are kept. null disables the masking.
  lagrangian_cutoff: 5.0e-4
  key_mapping:
    energy: e_total
    iqa_kinetic: T(A)
    iqa_vne: Vne(A,A)
    iqa_vee: Vee(A,A)
    iqa_vee_c: VeeC(A,A)
    iqa_vee_x: VeeX(A,A)
    iqa_intra_a: E_IQA_Intra(A)
    iqa_inter_a: E_IQA_Inter(A)
    iqa_inter_ab: E_IQA_Inter(A,B)/2
    iqa_forces_direct: Fn(A,SumB)
    iqa_forces_grad: Fn(A,SumB)
    # Edge-level pairwise IQA subterms (halved for directed graph)
    iqa_vne_ab: Vne(A,B)/2
    iqa_vee_ab: Vee(A,B)/2
    iqa_ven_ab: Ven(A,B)/2
    iqa_vnn_ab: Vnn(A,B)/2
    # Classical and exchange-correlation parts of V_ee(A,B)/2
    iqa_vee_c_ab: VeeC(A,B)/2
    iqa_vee_x_ab: VeeX(A,B)/2
    # dipole_scalar: "|Mu(A)|"
    dipole_vector: Mu(A)
    dipole_intra: Mu_Intra(A)
    # dipole_bond: Mu_Bond(A)
    # Atomic charge, in electrons. Listed in DIMENSIONLESS_KEYS in
    # iqa_pkl_dataset.py so it is not run through the Hartree -> eV conversion.
    iqa_charge: q(A)
  # Dimensionless fractions [numerator, denominator] for
  # tasks/iqa_decompose_subterm_fractions.yaml: the intra subterms as fractions of
  # E_IQA_Intra(A), the pair subterms as fractions of V_nn(A,B) (analytic, never 0;
  # E_inter(A,B) crosses 0, so X(A,B)/E_inter(A,B) is unbounded).
  ratio_key_mapping:
    iqa_kinetic_frac: ["T(A)", "E_IQA_Intra(A)"]
    iqa_vne_frac: ["Vne(A,A)", "E_IQA_Intra(A)"]
    iqa_vee_c_frac: ["VeeC(A,A)", "E_IQA_Intra(A)"]
    iqa_vee_x_frac: ["VeeX(A,A)", "E_IQA_Intra(A)"]
    iqa_vne_ab_frac: ["Vne(A,B)/2", "Vnn(A,B)/2"]
    iqa_ven_ab_frac: ["Ven(A,B)/2", "Vnn(A,B)/2"]
    iqa_vee_c_ab_frac: ["VeeC(A,B)/2", "Vnn(A,B)/2"]
    iqa_vee_x_ab_frac: ["VeeX(A,B)/2", "Vnn(A,B)/2"]

iqa_val:
  _target_: fairchem.core.datasets.iqa_pkl_dataset.IQAPKLDataset
  src: ${cluster.data_root_dir}/val
  name: ${dataset_list[0]}
  ht2ev: true
  # See iqa_train above.
  charge_key: q_total
  # Off for validation, so val metrics cover all atoms; set it to the iqa_train value
  # to evaluate on well-integrated atoms only.
  lagrangian_cutoff: null
  key_mapping:
    energy: e_total
    iqa_kinetic: T(A)
    iqa_vne: Vne(A,A)
    iqa_vee: Vee(A,A)
    iqa_vee_c: VeeC(A,A)
    iqa_vee_x: VeeX(A,A)
    iqa_intra_a: E_IQA_Intra(A)
    iqa_inter_a: E_IQA_Inter(A)
    iqa_inter_ab: E_IQA_Inter(A,B)/2
    iqa_forces_direct: Fn(A,SumB)
    iqa_forces_grad: Fn(A,SumB)
    # Edge-level pairwise IQA subterms (halved for directed graph)
    iqa_vne_ab: Vne(A,B)/2
    iqa_vee_ab: Vee(A,B)/2
    iqa_ven_ab: Ven(A,B)/2
    iqa_vnn_ab: Vnn(A,B)/2
    # Classical and exchange-correlation parts of V_ee(A,B)/2
    iqa_vee_c_ab: VeeC(A,B)/2
    iqa_vee_x_ab: VeeX(A,B)/2
    # dipole_scalar: "|Mu(A)|"
    dipole_vector: Mu(A)
    dipole_intra: Mu_Intra(A)
    # dipole_bond: Mu_Bond(A)
    # Atomic charge, in electrons. Listed in DIMENSIONLESS_KEYS in
    # iqa_pkl_dataset.py so it is not run through the Hartree -> eV conversion.
    iqa_charge: q(A)
  ratio_key_mapping: ${dataset.iqa_train.ratio_key_mapping}
