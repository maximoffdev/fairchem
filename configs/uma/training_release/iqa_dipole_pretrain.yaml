defaults:
  - cluster: leipzig_cluster
  - dataset: iqa_components
  - tasks: iqa_decompose_dipole
  - backbone: K4L2
  #- element_refs: iso_atom_elem_refs
  - _self_

job:
  device_type: ${cluster.device}
  scheduler:
    mode: ${cluster.mode}
    ranks_per_node: ${cluster.ranks_per_node}
    num_nodes: 1
    slurm:
      partition: ${cluster.partition}
      mem_gb: ${cluster.mem_gb}
      cpus_per_task: ${cluster.cpus_per_task}
      timeout_hr: "${cluster.timeout_hr}"
      setup_commands: ${cluster.setup_commands}
  debug: ${cluster.debug}
  run_dir: ${cluster.run_dir}
  run_name: dipole-charge-ref_otf_300neighbors_otf_chargecond_300neighbors_8A_48h
  logger:
    _target_: fairchem.core.common.logger.WandBSingletonLogger.init_wandb
    _partial_: true
    entity: lamerslab
    project: iqa

# --- Runtime Hyperparameters ---
epochs: 300
bf16: True

# --- Backbone/Model Variables (interpolated from cluster where VRAM-sensitive) ---
moe_layer_type: pytorch
num_moe_experts: ${cluster.num_moe_experts}
otf_graph: True
# IQA systems are isolated molecules with a zero cell -- build the radius graph
# aperiodically (the pbc path divides by a zero cell volume and yields NaN reps).
# Merged over the backbone config group, which is composed before _self_.
backbone:
  always_use_pbc: False
  # Neither head differentiates the energy w.r.t. positions.
  regress_forces: False
  # K4L2 wires this to ${element_refs}, which this config does not compose.
  term_element_refs: null

max_neighbors: ${cluster.max_neighbors}
cutoff_radius: ${cluster.cutoff_radius}
regress_stress: False
direct_forces: False

# iqa_kinetic_coef: 1.0
# iqa_vne_coef: 1.0
# iqa_vee_coef: 1.0
# iqa_inter_coef: 1.0
# # Edge-level coefficients
# iqa_inter_edge_coef: 1.0
# iqa_vee_edge_coef: 1.0
# iqa_vne_edge_coef: 1.0
# iqa_ven_edge_coef: 1.0
# iqa_vnn_edge_coef: 1.0
normalizer_rmsd: 1.0
# iqa_intra_a_coef: 1.0
# iqa_inter_a_coef: 1.0
# iqa_inter_ab_coef: 1.0
# --- DPM ---
# dipole_scalar_coef: 1.0 #refers to decompose.yaml
dipole_vector_coef: 1.0
# dipole_intra_coef: 1.0
# --- Atomic charges ---
iqa_charge_coef: 1.0
# --- Dataset Setup ---
dataset_list: ["iqa_pkl"]
exclude_keys: ["source", "sid"]


train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${dataset.iqa_train}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: ${cluster.max_atoms}
    shuffle: True
    seed: 123
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}

eval_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${dataset.iqa_val}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: ${cluster.max_atoms}
    shuffle: False
    seed: 123
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}

heads:
  # iqa_kinetic:
  #   module: fairchem.core.models.uma.escn_md.IQA_Energy_Head
  # iqa_vne:
  #   module: fairchem.core.models.uma.escn_md.IQA_Energy_Head
  # iqa_vee:
  #   module: fairchem.core.models.uma.escn_md.IQA_Energy_Head
  # iqa_inter:
  #   module: fairchem.core.models.uma.escn_md.IQA_Energy_Head
  # # Edge-level heads for pairwise interactions
  # iqa_inter_edge:
  #   module: fairchem.core.models.uma.escn_md.IQA_Edge_Head
  # iqa_vee_edge:
  #   module: fairchem.core.models.uma.escn_md.IQA_Edge_Head
  # iqa_vne_edge:
  #   module: fairchem.core.models.uma.escn_md.IQA_Edge_Head
  # iqa_ven_edge:
  #   module: fairchem.core.models.uma.escn_md.IQA_Edge_Head
  # iqa_vnn_edge:
  #   module: fairchem.core.models.uma.escn_md.IQA_Edge_Head
  #iqa_intra_a:
  #  module: fairchem.core.models.uma.escn_md.IQA_Node_Head2
  #iqa_inter_a:
  #  module: fairchem.core.models.uma.escn_md.IQA_Node_Head2
  #iqa_inter_ab:
  #  module: fairchem.core.models.uma.escn_md.IQA_Edge_Head2
  # dipole_scalar:           #scalar DPM Head
  #   module: fairchem.core.models.uma.escn_md.MLP_Dipole_Scalar_Head
  # dipole_vector:           #vectorial DPM Head
  #   module: fairchem.core.models.uma.escn_md.MLP_Dipole_Vector_Head
  # dipole_intra:           #vectorial, internal DPM Head
  #   module: fairchem.core.models.uma.escn_md.MLP_Dipole_Vector_Head
  # Head names must match the task names in tasks/iqa_decompose_dipole.yaml:
  # compute_loss() looks predictions up as predictions[task.name][task.property].
  # Equivariant SO3 head -> rotates with the molecule, as a dipole must.
  dipole_vector:
    module: fairchem.core.models.uma.escn_md.MLP_Dipole_Vector_Head
    property_name: dipole_vector
  # Invariant head (L=0 features + norms of L>0) -> a charge is a scalar.
  # Returns {"pred": (N,)}, hence `property: pred` on the task.
  iqa_charge:
    module: fairchem.core.models.uma.escn_md.IQA_Node_Head2
    dropout: 0.0

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: ${backbone}
      # False -> outputs stay nested as {head_name: {property: tensor}}, which is
      # what compute_loss() expects. Only set this True for heads that already
      # emit {task_name: {property: tensor}} themselves (e.g. the combined
      # node+edge IQA head); these two heads return a bare {property: tensor}.
      pass_through_head_outputs: false
      # _target_: fairchem.core.units.mlip_unit.mlip_unit.initialize_finetuning_model
      # checkpoint_location: /home/sc.uni-leipzig.de/rh41uvuh/.cache/huggingface/hub/models--facebook--UMA/snapshots/be2896459a03fcde05e20d2fcefd11f450601fce/checkpoints/uma-s-1p2.pt
      # overrides:
      #   freeze_backbone: true
      #   pass_through_head_outputs: false
      heads: ${heads}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 8e-4
      weight_decay: 1e-3
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2 
      warmup_epochs: 0.01 #maybe increase to 0.05-0.1?
      lr_min_factor: 0.01
      epochs: ${epochs}
      steps: null
    print_every: 10
    clip_grad_norm: 100
    bf16: ${bf16}
  max_epochs: ${epochs}
  max_steps: null
  evaluate_every_n_steps: 500
  callbacks:
    - _target_: fairchem.core.common.profiler_utils.ProfilerCallback
      job_config: ${job}
    - _target_: fairchem.core.components.train.train_runner.TrainCheckpointCallback
      checkpoint_every_n_steps: 5000
      max_saved_checkpoints: 3
      save_best_val_checkpoint: true
