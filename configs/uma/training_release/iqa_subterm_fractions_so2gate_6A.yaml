# Predicts E_intra(A) and E_inter(A,B)/2 directly, and every subterm as a fraction:
# of E_intra(A) for the intra-atomic terms, of the analytic V_nn(A,B) for the pair
# terms (tasks/iqa_decompose_subterm_fractions). Same backbone, cutoff, optimizer and
# shared-trunk so2_gate head as iqa_subterms_cx_so2gate_6A.
# See IQA_SUBTERMS_CX_2026-10.md.
defaults:
  - iqa_subterms_atomchg_common
  - tasks: iqa_decompose_subterm_fractions
  - derived_metrics: iqa_decompose_subterm_fractions
  - _self_

job:
  run_name: le-subterm_fractions_sharedtrunk_so2gate_atomchargecond_sigma0.02_lagcut5e-4_otf_300neighbors_6A_36h

cutoff_radius: 6.0  # A; otf graph and radial basis cutoff

# Fit 2026-10-26 with iqa_compute_normalizers.py on sumformulasplit/train (118699 pkls,
# lagrangian_cutoff 5e-4). E_intra (eV, after element refs) and E_inter/2 (eV, raw)
# equal the intra/inter models'.
normalizer_mean_iqa_intra_a: -0.000502284
normalizer_rmsd_iqa_intra_a: 5.8638
normalizer_mean_iqa_inter_ab: -0.690282
normalizer_rmsd_iqa_inter_ab: 2.68978
# Fractions of E_intra(A), dimensionless: z-score of the residual after the per-element
# mean fraction (element_refs iqa_*_frac). Raw mean/std: T -1.160/0.207,
# V_ne 2.555/0.309, V_ee^C -0.668/0.285, V_ee^X 0.273/0.185. H dominates the residual
# (std 0.15-0.36 vs 0.0003-0.04 for heavy atoms).
normalizer_mean_iqa_kinetic_frac: 0.0
normalizer_rmsd_iqa_kinetic_frac: 0.142862
normalizer_mean_iqa_vne_frac: 0.0
normalizer_rmsd_iqa_vne_frac: 0.266232
normalizer_mean_iqa_vee_c_frac: 0.0
normalizer_rmsd_iqa_vee_c_frac: 0.238591
normalizer_mean_iqa_vee_x_frac: 0.0
normalizer_rmsd_iqa_vee_x_frac: 0.109568
# Fractions of V_nn(A,B), dimensionless, global z-score (|x| <= 3.1 on all edges).
# iqa_ven_ab_frac uses the V_ne one.
normalizer_mean_iqa_vne_ab_frac: -0.928869
normalizer_rmsd_iqa_vne_ab_frac: 0.202171
normalizer_mean_iqa_vee_c_ab_frac: 0.866003
normalizer_rmsd_iqa_vee_c_ab_frac: 0.267379
normalizer_mean_iqa_vee_x_ab_frac: -0.00830768
normalizer_rmsd_iqa_vee_x_ab_frac: 0.0222411
# V_nn is analytic: identity normalizer leaves the physical value untouched.
normalizer_mean_iqa_vnn_ab: 0.0
normalizer_rmsd_iqa_vnn_ab: 1.0

iqa_intra_a_coef: 1.0
iqa_kinetic_frac_coef: 1.0
iqa_vne_frac_coef: 1.0
iqa_vee_c_frac_coef: 1.0
iqa_vee_x_frac_coef: 1.0
iqa_inter_ab_coef: 1.0
iqa_vne_ab_frac_coef: 1.0
iqa_ven_ab_frac_coef: 1.0
iqa_vee_c_ab_frac_coef: 1.0
iqa_vee_x_ab_frac_coef: 1.0
# V_nn is deterministic (analytic head) -> nothing to learn, keep it out of the loss.
iqa_vnn_ab_coef: 0.0

heads:
  iqa_subterms_head:
    activation_type: so2_gate
    node_task_names:
      [iqa_intra_a, iqa_kinetic_frac, iqa_vne_frac, iqa_vee_c_frac, iqa_vee_x_frac]
    edge_task_names:
      [iqa_inter_ab, iqa_vne_ab_frac, iqa_vee_c_ab_frac, iqa_vee_x_ab_frac]
    # E_inter, V_ee^C, V_ee^X and V_nn are symmetric in (A,B), so are their fractions;
    # V_en(A,B)/V_nn(A,B) = V_ne(B,A)/V_nn(B,A) is the V_ne fraction of the reversed edge.
    symmetric_edge_task_names: [iqa_inter_ab, iqa_vee_c_ab_frac, iqa_vee_x_ab_frac]
    reversed_edge_tasks:
      iqa_ven_ab_frac: iqa_vne_ab_frac
