model: fairchem.core.models.uma.escn_moe.eSCNMDMoeBackbone
moe_dropout: 0.05
moe_layer_type: ${moe_layer_type}
num_experts: ${num_moe_experts}
use_composition_embedding: true
use_global_embedding: false

max_num_elements: 100
sphere_channels: 128
lmax: 2
mmax: 2

otf_graph: ${otf_graph}
max_neighbors: ${max_neighbors}
use_pbc: True
use_pbc_single: True
# Only consulted when otf_graph is True. Defaults to True (periodic); the IQA
# configs set always_use_pbc: False at the top level because those systems are
# isolated molecules with a zero cell, where the pbc path divides by a zero cell
# volume and produces NaN cell repetitions.
always_use_pbc: ${oc.select:always_use_pbc,True}

cutoff: ${cutoff_radius}
edge_channels: 128
distance_function: gaussian
num_distance_basis: 64

regress_forces: False
regress_stress: ${regress_stress}
direct_forces: ${direct_forces}

num_layers: 4
hidden_channels: 128
norm_type: rms_norm_sh
act_type: gate
ff_type: spectral

chg_spin_emb_type: "rand_emb"
cs_emb_grad: True
dataset_list: ${dataset_list}
output_edge_features: True  # Required for edge-level IQA predictions
#activation_checkpointing: True  # Save 50-70% memory by recomputing activations during backward pass
term_element_refs: ${element_refs}
